# Compose resources are intentionally addressed by service name. run.sh
# supplies a unique COMPOSE_PROJECT_NAME. Published ports bind only to
# loopback; an empty host-port override asks Docker for an ephemeral port.
# The Drupal volume is project-scoped and removed by `down -v`. The mounted
# schema is Wayfinder's maintained search-api preset.
services:
  wayfinder:
    build:
      context: ../../../..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WAYFINDER_HOST_PORT:-}:8983"
    volumes:
      - ../../../../presets/search-api.toml:/schema.toml:ro
      - ./wayfinder.toml:/wayfinder.toml:ro
    environment:
      WAYFINDER_CONFIG: /wayfinder.toml
    command: ["/schema.toml", "/data", "0.0.0.0:8983"]

  drupal:
    image: drupal:11-php8.3-apache
    depends_on:
      - wayfinder
    ports:
      - "127.0.0.1:${DRUPAL_HOST_PORT:-}:80"
    volumes:
      - drupal_site:/opt/drupal
      - ../../:/opt/module-src:ro

volumes:
  drupal_site:
