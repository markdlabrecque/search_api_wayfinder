name: PHPUnit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']

    defaults:
      run:
        working-directory: wayfinder/drupal/search_api_wayfinder

    steps:
      # The fixture paths in six test classes only resolve from this layout.
      - name: Check out Wayfinder fixtures
        uses: actions/checkout@v4
        with:
          repository: markdlabrecque/wayfinder
          path: wayfinder

      - name: Check out search_api_wayfinder
        uses: actions/checkout@v4
        with:
          path: wayfinder/drupal/search_api_wayfinder

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: dom, gd, mbstring, pdo, simplexml, xml, xmlwriter
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('wayfinder/drupal/search_api_wayfinder/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit
